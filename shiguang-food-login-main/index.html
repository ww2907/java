<title>食光 · 美食 — 登录</title>
<style>
  :root {
    --teal: #00b894;
    --cyan: #00cec9;
    --mint: #55efc4;
    --aqua: #48e0c0;
    --deep: #0a6b6b;
    --ink: #0f3d3d;
    --muted: #5a8a87;
    --card: rgba(255, 255, 255, 0.88);
    --line: #cdeee6;
    --shadow: 0 18px 50px rgba(0, 150, 136, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(150deg, #00b894 0%, #00cec9 45%, #48e0c0 100%);
    background-size: 300% 300%;
    animation: bgShift 16s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  /* 跟随鼠标的柔光 */
  body::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(440px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.22), transparent 60%);
    pointer-events: none; z-index: 1;
  }

  /* 漂浮光斑 */
  .bokeh {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
    animation-name: riseBokeh; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes riseBokeh {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    15% { opacity: 0.9; }
    85% { opacity: 0.8; }
    100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
  }

  /* 漂浮食物（JS 驱动，保证任意时刻 ≥15 个同时可见，且都从底端升到顶端才消失） */
  .emoji-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .rise-emoji {
    position: absolute; bottom: 0; opacity: 0; user-select: none;
    will-change: transform, opacity; animation: riseFood 18s linear infinite;
  }
  .e-inner {
    display: inline-block;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
  }
  @keyframes riseFood {
    0%   { transform: translateY(15vh); opacity: 0; }
    6%   { opacity: 0.92; }
    94%  { opacity: 0.92; }
    100% { transform: translateY(-105vh); opacity: 0; }
  }

  /* 居中主容器 */
  .stage {
    position: relative; z-index: 3;
    width: 100%; max-width: 460px; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .brand-top { text-align: center; margin-bottom: 26px; color: #fff; }
  .brand-top .logo {
    font-size: 30px; font-weight: 900; letter-spacing: 2px;
    display: inline-flex; align-items: center; gap: 12px;
    text-shadow: 0 4px 18px rgba(0,80,70,0.35);
  }
  .brand-top .logo .mark {
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,0.25); display: grid; place-items: center;
    font-size: 26px; backdrop-filter: blur(4px);
  }
  .brand-top .tagline { margin-top: 12px; font-size: 14px; opacity: 0.95; text-shadow: 0 2px 10px rgba(0,80,70,0.3); }

  /* 登录卡片 */
  .login-card {
    width: 100%;
    background: var(--card);
    backdrop-filter: blur(16px);
    border-radius: 28px;
    padding: 42px 38px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
    animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(34px) scale(0.97); } to { opacity: 1; transform: none; } }

  .login-card .top { text-align: center; margin-bottom: 28px; }
  .login-card .top h2 { font-size: 26px; font-weight: 900; }
  .login-card .top h2 span {
    background: linear-gradient(90deg, var(--teal), var(--cyan), var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto; animation: flow 4s linear infinite;
  }
  @keyframes flow { to { background-position: 200% center; } }
  .login-card .top p { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
  .field .input { position: relative; }
  .field input {
    width: 100%; padding: 14px 16px 14px 44px;
    border: 1.5px solid var(--line); border-radius: 14px;
    font-size: 15px; color: var(--ink); background: #f7fffc;
    transition: border-color 0.25s, box-shadow 0.25s; outline: none;
  }
  .field input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 4px rgba(0,206,201,0.18), 0 0 18px rgba(85,239,196,0.3);
  }
  .field .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.6; transition: opacity .25s; }
  .field input:focus ~ .icon { opacity: 1; }
  .field .toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
  .err { color: #e5533c; font-size: 12px; margin-top: 6px; display: none; }

  .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 6px 0 22px; }
  .row label { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--muted); }
  .row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--teal); }
  .row a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .row a:hover { text-decoration: underline; }

  .btn-primary {
    position: relative; overflow: hidden; width: 100%; padding: 15px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--teal), var(--cyan));
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; box-shadow: 0 10px 24px rgba(0,150,136,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary::after {
    content: ""; position: absolute; top: 0; left: -130%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg); animation: shimmer 3.2s infinite;
  }
  @keyframes shimmer { 0% { left: -130%; } 55%,100% { left: 140%; } }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,150,136,0.55); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary.loading { pointer-events: none; opacity: 0.85; }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { display: flex; align-items: center; gap: 12px; margin: 26px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .socials { display: flex; gap: 14px; }
  .socials button {
    flex: 1; padding: 12px; border: 1.5px solid var(--line); border-radius: 14px;
    background: #f7fffc; font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer; transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .socials button:hover { transform: translateY(-3px); border-color: var(--cyan); background: #e6fffa; box-shadow: 0 8px 18px rgba(0,206,201,0.22); }

  .signup { text-align: center; margin-top: 26px; font-size: 14px; color: var(--muted); }
  .signup a { color: var(--teal); font-weight: 700; text-decoration: none; }
  .signup a:hover { text-decoration: underline; }

  /* 成功提示 */
  .toast {
    position: fixed; top: 28px; left: 50%;
    transform: translateX(-50%) translateY(-20px) scale(0.95);
    background: linear-gradient(135deg, var(--teal), var(--cyan));
    color: #fff; padding: 14px 26px; border-radius: 14px;
    font-weight: 700; box-shadow: 0 10px 30px rgba(0,150,136,0.45);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  @media (max-width: 520px) {
    .stage { padding: 16px; }
    .login-card { padding: 34px 24px; }
    .emoji-layer { display: none; }
  }
</style>

  const submitBtn = document.getElementById('submitBtn');

  // 显示/隐藏密码
  document.getElementById('togglePw').addEventListener('click', function () {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';
  });

  function validAccount(v) {
    const phone = /^1[3-9]\d{9}$/;
    const email = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return phone.test(v) || email.test(v);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // 跟随鼠标的柔光
  document.body.addEventListener('mousemove', (e) => {
    document.body.style.setProperty('--mx', e.clientX + 'px');
    document.body.style.setProperty('--my', e.clientY + 'px');
  });

  // 漂浮光斑（已改为纯 CSS 静态元素，见 body 内 .bokeh）

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    let ok = true;

    if (!validAccount(account.value.trim())) { errAccount.style.display = 'block'; ok = false; }
    else { errAccount.style.display = 'none'; }

    if (password.value.length < 6) { errPassword.style.display = 'block'; ok = false; }
    else { errPassword.style.display = 'none'; }

    if (!ok) return;

    submitBtn.classList.add('loading');
    submitBtn.innerHTML = '<span class="spinner"></span> 登录中…';
    setTimeout(() => {
      submitBtn.classList.remove('loading');
      submitBtn.textContent = '登 录';
      const remember = document.getElementById('remember').checked;
      showToast('登录成功，欢迎回到食光！🎉');
      console.log('登录信息：', { account: account.value.trim(), password: '******', remember });
    }, 1300);
  });

  // 第三方登录（演示）
  document.querySelectorAll('.socials button').forEach(btn => {
    btn.addEventListener('click', () => showToast('正在跳转 ' + btn.dataset.social + ' 授权…'));
  });
</script>
</body>
</html>
